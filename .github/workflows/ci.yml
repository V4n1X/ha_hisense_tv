name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch/PR are cancelled immediately instead of
# queueing behind them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_PROGRESS_BAR: off

jobs:
  tests:
    name: Unit tests & HA import smoke test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Home Assistant 2026.3 and newer require Python >= 3.14.2. On 3.13 pip
        # silently resolves `homeassistant` to 2026.2.x, which would test (and
        # canary) an HA release older than the supported minimum.
        python-version: ["3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Pip download/wheel cache (~/.cache/pip): includes the heavy
          # Home Assistant wheels after the first run. Key covers ALL
          # requirement files so dependency changes invalidate properly.
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt

      # Fast feedback first: protocol/payload/dispatcher tests do not need
      # the real Home Assistant package (conftest provides minimal stubs),
      # so they run before the expensive HA install.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      # Home Assistant's official ruff rule set (mirrored in pyproject.toml).
      # Replaces the former bare pyflakes check: same static guarantees plus
      # HA-specific rules (imports, async, logging, security, docstrings).
      - name: Lint (ruff, Home Assistant rule set)
        run: python -m ruff check custom_components tests scripts

      # Same formatter Home Assistant core uses; --check fails when any file
      # is not formatted (fix locally with: python -m ruff format .)
      - name: Format check (ruff format)
        run: python -m ruff format --check custom_components tests scripts

      # --cov measures custom_components/hisense_tv only (see pyproject.toml
      # [tool.coverage.*]). fail-under is a ratchet: raise it as coverage grows,
      # it only guarantees the suite cannot silently regress below the baseline.
      - name: Run unit tests (no Home Assistant required)
        run: >-
          python -m pytest tests --ignore=tests/test_ha_smoke.py -q --tb=short
          --cov --cov-report=term-missing --cov-fail-under=44.0

      # Informational: maps the missing lines to named functions/steps so the
      # log shows WHICH code paths the suite does not reach (dev aid:
      # scripts/coverage_gaps.py against a local .coverage file).
      - name: Surface uncovered integration code paths
        run: python scripts/coverage_gaps.py
        if: success() || failure()

      - name: Install Home Assistant (cached wheels)
        run: pip install -r requirements_ci.txt

      - name: Run full-import smoke test against real Home Assistant
        run: >-
          python -m pytest tests/test_ha_smoke.py -v --tb=short
          --deselect tests/test_ha_smoke.py::test_setup_triggers_no_ha_deprecation_warnings

      # Fails when HA itself reports deprecated API usage (e.g. new device
      # registry deprecations in a fresh release) or blocking calls in the
      # event loop during the full setup of the integration.
      - name: Deprecation canary (full setup against real Home Assistant)
        run: python -m pytest tests/test_ha_smoke.py::test_setup_triggers_no_ha_deprecation_warnings -v --tb=short

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate integration with hassfest
        uses: home-assistant/actions/hassfest@master

  # Local mirror of the hassfest job: run the exact same official container
  # image that CI uses, so validation can be reproduced on any machine with
  # Docker (no Python/HA install needed):
  #
  #   docker run --rm -v "$(pwd):/github/workspace" -w /github/workspace   #     ghcr.io/home-assistant/hassfest:latest
  #
  # On Windows (Git Bash) prefix the mount path with an extra slash:
  #   -v "//$(pwd):/github/workspace"
  hassfest-docker:
    name: Hassfest validation (Docker, official image)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate integration with hassfest (official container)
        run: |
          docker run --rm             -v "${{ github.workspace }}:/github/workspace"             -w /github/workspace             ghcr.io/home-assistant/hassfest:latest

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate against HACS action defaults
        uses: hacs/action@main
        with:
          category: integration
