# Pre-commit hooks: the same checks CI runs, executed locally before each
# commit (see .github/workflows/ci.yml).
#
# Setup (once per clone):
#     pip install --user pre-commit
#     pre-commit install
#
# Run on demand against everything:
#     pre-commit run --all-files
#
# Ruff is configured in pyproject.toml (Home Assistant's official rule set).
# Hook revisions are pinned to the same 0.16.x line as CI so lint and
# formatting verdicts can never differ between local and CI.

repos:
  # Ruff lint + format (astral-sh/ruff-pre-commit mirrors the ruff releases).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Mirrors the CI "Lint (ruff, Home Assistant rule set)" step.
      - id: ruff
        args: [--fix]
      # Mirrors the CI "Format check (ruff format)" step.
      - id: ruff-format

  # Repo-own encoding gate: rejects stored U+FFFD, C0/C1 control characters
  # (the stray 0x1A that once shipped inside docs/PROTOCOL.md), DEL, UTF-8
  # BOMs and invalid UTF-8. The same check runs in CI via tests/test_encoding.py.
  - repo: local
    hooks:
      - id: check-encoding
        name: check encoding (U+FFFD, control chars, BOM, invalid UTF-8)
        entry: python scripts/check_encoding.py
        language: python
        pass_filenames: false
